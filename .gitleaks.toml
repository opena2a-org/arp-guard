title = "ARP Secret Detection Rules"

[extend]
useDefault = true

# gitleaks takes the first non-empty capture group of a rule's regex as the
# secret, or the whole match when there is none, and --redact masks only that.
# So a rule captures the value and nothing else, or captures nothing: the key
# name, the URL scheme and the key type are in non-capturing groups.
#
# The secret is also the text gitleaks tests the global allowlist against, and
# that includes the allowlist of the default configuration extended above. So
# api-key-generic and database-password do not report a value that allowlist
# matches. For both rules, that is:
# - one repeated letter, or a value that holds the alphabet in order
# - a value that starts with `true`, contains `false` or ends with `null`, in
#   any case, such as the password trueblue2024: the default regex
#   (?i)^true|false|null$ does not group its alternatives
# For database-password, it is also:
# - a run of `*`, or a run of `.`
# - a reference: $NAME, ${NAME}, a $ followed by digits, %NAME%, {{name}},
#   {{.Values.name}} or ${{secrets.NAME}}
# - a path that starts with /bin/, /etc/, /home/, /opt/, /tmp/, /usr/, /var/
#   or /Users/<name>/
# test/gitleaks-config.test.mjs runs gitleaks on a line of each of these kinds.

[[rules]]
id = "api-key-generic"
description = "Generic API key assignment"
regex = '''(?i)(?:api[_-]?key|apikey|secret[_-]?key)\s*[:=]\s*["']([A-Za-z0-9_\-]{20,})["']'''
tags = ["api", "key"]

[[rules]]
id = "jwt-token"
description = "JSON Web Token"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
tags = ["jwt", "token"]

[[rules]]
id = "pem-private-key"
description = "PEM-encoded private key"
regex = '''-----BEGIN\s*(?:RSA|EC|OPENSSH|DSA|ED25519|ENCRYPTED)?\s*PRIVATE KEY-----'''
tags = ["crypto", "key"]

[[rules]]
id = "database-password"
description = "Database connection with password"
regex = '''(?i)(?:postgres|mysql|mongodb)://[^:]+:([^@\s]{8,})@'''
tags = ["database", "credential"]

[allowlist]
description = "Global allowlist"
paths = [
  '''(.*/)?\.test\.(ts|js)$''',
  '''(.*/)?test/.*$''',
  '''(.*/)?tests/.*$''',
  '''(.*/)?fixtures/.*$''',
  '''(.*/)?examples/.*$''',
  '''\.gitleaks\.toml$''',
  '''package-lock\.json$''',
]
