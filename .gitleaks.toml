title = "ARP Secret Detection Rules"

[extend]
useDefault = true

# gitleaks takes the first non-empty capture group of a rule's regex as the
# secret, or the whole match when there is none, and --redact masks only that.
# So a rule captures the value and nothing else, or captures nothing: the key
# name, the URL scheme and the key type are in non-capturing groups.
#
# The secret is also the text gitleaks tests the global allowlist against, and
# that includes the allowlist of the default configuration extended above. So
# api-key-generic and database-password do not report a value that allowlist
# matches. For both rules, that is:
# - one repeated letter, or a value that holds the alphabet in order
# - a value that holds 014df517-39d1-4453-b7b3-9930c563627c, the other
#   stopword of the default allowlist
# - a value that starts with `true`, contains `false` or ends with `null`, in
#   any case, such as the password trueblue2024: the default regex
#   (?i)^true|false|null$ does not group its alternatives
# For database-password, it is also:
# - a run of `*`, or a run of `.`
# - a reference: $NAME, ${NAME}, a $ followed by digits or by digits in
#   braces, or %NAME%, where NAME holds only letters and `_`
# - {{ and }} around only letters, digits, `_`, spaces, `.`, `|`, `(` and
#   `)`, such as {{name}}, {{.Values.name}}, {{.Values.db|quote}},
#   {{(password)}} or {{........}}
# - ${{ and }} around secrets, env, vars or github, then one or more
#   segments of a `.` and a name of two or more letters, digits or `_` that
#   starts with a letter, then only letters, digits, `_`, spaces, quotes,
#   `&`, `.`, `/`, `=` and `|`, such as ${{secrets.NAME}}, ${{env.NAME}},
#   ${{vars.NAME}}, ${{github.NAME}}, ${{secrets.DB.PASSWORD}} or
#   ${{env.DB_PASSWORD||'x'}}
# - a path that starts with /bin/, /etc/, /home/, /opt/, /tmp/, /usr/ or
#   /var/, then holds only letters, digits, `_`, `.`, `/` and `-`, such as
#   /tmp/db-pass.word_1
# - a path that starts with /Users/<name>/, where <name> holds only letters
#   and digits, then holds only letters, digits, `_`, `.` and `/`
# The letters in each of these kinds match in any case, such as $DbPassword,
# /TMP/dbpassword or the password $ecretPass. gitleaks matches the stopwords
# in any case, and the (?i) of (?i)^true|false|null$ applies to the default
# regexes after it.
# A value with a character that a kind above does not hold in that place, or
# with a name of one letter after secrets, env, vars or github, is not of that
# kind: database-password reports values such as $DB_PASSWORD1,
# ${DB_PASSWORD1}, %DB_PASSWORD1%, {{db-pass}}, ${{secrets.D}}, ${{env.D}},
# ${{vars.D}}, ${{github.D}}, /tmp/pa$sword1, /Users/app/db-password or
# /Users/app_1/dbpassword.
# The letters in the reference, {{...}}, ${{...}} and path kinds are ASCII
# letters, and the digits in those kinds are ASCII digits, since the default
# regexes for them use \w and other classes of ASCII letters and digits, such
# as [A-Za-z]. A value with any other letter or digit in those places is not
# of these kinds, so database-password reports values such as
# $P<U+00C4>SSWORD_X, ${P<U+00C4>SSWORD}, %P<U+00C4>SSWORD%, $1234567<U+0663>,
# ${1234567<U+0663>}, {{p<U+00E4>ssword}}, {{pass<U+0663>word}},
# ${{secrets.P<U+00C4>SSWORD}}, ${{secrets.DB_PASSWORD<U+0663>}},
# /tmp/p<U+00E4>ssword, /tmp/pass<U+0663>word, /Users/<U+00E4>pp/dbpassword or
# /Users/app<U+0663>/dbpassword, where U+0663 is the Arabic-Indic digit three.
# It still does not report such a value when another kind above matches it,
# such as {{p<U+00E4>sswordfalse}}, which contains `false`, or
# {{<U+00E4>abcdefghijklmnopqrstuvwxyz}}, which holds the alphabet.
# The only exceptions are two letters, U+212A (the Kelvin sign) and U+017F
# (the long s), which the (?i) matches as k and s, so database-password does
# not report $<U+212A>EYNAME_X, {{<U+212A>eyname}},
# ${{secrets.pa<U+017F><U+017F>word}} or /tmp/pa<U+017F><U+017F>word.
# test/gitleaks-config.test.mjs runs gitleaks on a line of each of these kinds.

[[rules]]
id = "api-key-generic"
description = "Generic API key assignment"
regex = '''(?i)(?:api[_-]?key|apikey|secret[_-]?key)\s*[:=]\s*["']([A-Za-z0-9_\-]{20,})["']'''
tags = ["api", "key"]

[[rules]]
id = "jwt-token"
description = "JSON Web Token"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
tags = ["jwt", "token"]

[[rules]]
id = "pem-private-key"
description = "PEM-encoded private key"
regex = '''-----BEGIN\s*(?:RSA|EC|OPENSSH|DSA|ED25519|ENCRYPTED)?\s*PRIVATE KEY-----'''
tags = ["crypto", "key"]

[[rules]]
id = "database-password"
description = "Database connection with password"
regex = '''(?i)(?:postgres|mysql|mongodb)://[^:]+:([^@\s]{8,})@'''
tags = ["database", "credential"]

[allowlist]
description = "Global allowlist"
paths = [
  '''(.*/)?\.test\.(ts|js)$''',
  '''(.*/)?test/.*$''',
  '''(.*/)?tests/.*$''',
  '''(.*/)?fixtures/.*$''',
  '''(.*/)?examples/.*$''',
  '''\.gitleaks\.toml$''',
  '''package-lock\.json$''',
]
